// ===================== 初始化Three.js =====================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const initCamPos = {x:0,y:0,z:3.2};
camera.position.set(initCamPos.x,initCamPos.y,initCamPos.z);

const ambientLight = new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
dirLight.position.set(3,3,3);
scene.add(dirLight);

// 人体简易躯干模型
const bodyGeo = new THREE.CylinderGeometry(0.35,0.28,1.4,16);
const bodyMat = new THREE.MeshStandardMaterial({color:0xffddcc,transparent:true,opacity:0.7});
const bodyMesh = new THREE.Mesh(bodyGeo,bodyMat);
bodyMesh.position.y = 0.2;
scene.add(bodyMesh);

// 绘制经络线 + 穴位点
let allPointsObj = [];
let highlightMesh = null;
meridianData.forEach(mer=>{
  const pts = mer.points.map(p=>new THREE.Vector3(p.x,p.y,p.z));
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const lineMat = new THREE.LineBasicMaterial({color:mer.color});
  const line = new THREE.Line(lineGeo,lineMat);
  scene.add(line);

  const dotMat = new THREE.MeshBasicMaterial({color:mer.color});
  const dotGeo = new THREE.SphereGeometry(0.018,8,8);
  mer.points.forEach(p=>{
    const dot = new THREE.Mesh(dotGeo,dotMat);
    dot.position.set(p.x,p.y,p.z);
    dot.userData = {name:p.name};
    scene.add(dot);
    allPointsObj.push(dot);
  })
});

// 搜索穴位
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input',()=>{
  const kw = searchInput.value.trim();
  if(!kw){
    if(highlightMesh){scene.remove(highlightMesh);highlightMesh=null;}
    return;
  }
  const target = allPointsObj.find(d=>d.userData.name.includes(kw));
  if(target){
    // 镜头移动
    const p = target.position;
    camera.position.set(p.x*1.8, p.y+0.4, p.z+1.2);
    controls.target.copy(p);
    // 高亮闪烁球
    if(highlightMesh) scene.remove(highlightMesh);
    const hGeo = new THREE.SphereGeometry(0.04,12,12);
    const hMat = new THREE.MeshBasicMaterial({color:0xffffff});
    highlightMesh = new THREE.Mesh(hGeo,hMat);
    highlightMesh.position.copy(p);
    scene.add(highlightMesh);
  }else{
    if(highlightMesh){scene.remove(highlightMesh);highlightMesh=null;}
  }
});

// 重置视角按钮
document.getElementById('resetBtn').onclick = ()=>{
  camera.position.set(initCamPos.x,initCamPos.y,initCamPos.z);
  controls.target.set(0,0,0);
  if(highlightMesh){scene.remove(highlightMesh);highlightMesh=null;}
  searchInput.value = '';
};

window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 动画循环
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  if(highlightMesh){
    highlightMesh.scale.setScalar(1+Math.sin(Date.now()*0.006)*0.25);
  }
  renderer.render(scene,camera);
}
animate();
</script>
